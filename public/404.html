<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Stop not found · Sudeep Bhandari</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #000000; color: #ffffff;
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 680px; }
      p.eyebrow { font: 500 12px/16px ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: #9b9b9b; margin: 0; display: flex; align-items: center; gap: 8px; }
      p.eyebrow span { width: 8px; height: 8px; border-radius: 9999px; border: 1px solid #ff6b2c; }
      h1 { font-size: 48px; line-height: 1; font-weight: 600; letter-spacing: -.025em; margin: 24px 0 0; text-wrap: balance; }
      p.body { font-size: 16px; line-height: 24px; color: #9b9b9b; margin: 24px 0 0; text-wrap: pretty; }
      a { display: inline-block; margin-top: 32px; padding: 8px 12px; border-radius: 9999px; background: #ffffff; color: #000000;
        font-weight: 600; font-size: 16px; line-height: 24px; text-decoration: none; transition: background-color 300ms cubic-bezier(0.22,1,0.36,1); }
      a:hover { background: #e6e6e6; }
      a:focus-visible { outline: 2px solid #ff6b2c; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow"><span></span>Stop 404</p>
      <h1>This stop isn’t on the line.</h1>
      <p class="body">The page you were looking for doesn’t exist or has moved.</p>
      <a href="/">Back to the first stop</a>
    </main>
  </body>
</html>
