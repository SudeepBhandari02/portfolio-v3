    <script>
      // Stored theme, applied before first paint so the page never flashes the wrong one.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#ffffff'
        }
      } catch (e) {}
    </script>

    <!--
      DIRECTION
      THESIS: One cell, one definition. A single orange square is the only ornament; it grows into whole
        surfaces. Refuses the dev-portfolio default of cards, gradients and a terminal motif.
      OWN-WORLD: Black, white, one orange used as full fields. One variable family (Archivo) worked on its
        width axis, heavy and condensed for display; Geist Mono for labels. Square corners everywhere, hairline rules.
      STORY: Who he is in one line, what he believes, the one product he built alone, then the record.
      FIRST VIEWPORT: The name fills the floor of the screen in condensed capitals that widen under the pointer;
        one orange cell sits where the full stop would. Scroll and that cell becomes the page.
      MOTION: GSAP + ScrollTrigger + SplitText on Lenis. Pinned scenes carry the argument; reduced motion gets
        the same content laid flat.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
